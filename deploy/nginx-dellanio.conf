# Bloco a usar no "server { listen 443 ssl; server_name dellanio.com ... }" de
# /var/www/dellanio.com/default.conf (o nginx do contêiner dellanio-site), no
# lugar do antigo "location / { try_files $uri $uri/ =404; }".
#
# A raiz geral (root /usr/share/nginx/html) continua a mesma: dela saem os
# desafios do Let's Encrypt de todos os subdomínios. Só o site muda para
# site/current (que o deploy/deploy.sh atualiza). As regras de segurança do
# arquivo (dotfiles, .conf, .yml...) seguem valendo.
#
# Cache por "expires": um add_header aqui apagaria o HSTS do server nestes locations.

    # >>> dellanio:site-3d (deploy/deploy.sh publica em site/releases; site/current = no ar)
    # a página: sempre revalida, para uma versão nova aparecer logo
    location = /index.html {
        root /usr/share/nginx/html/site/current;
        expires -1;
    }
    # JS/CSS com hash no nome: cache permanente
    location ^~ /assets/ {
        root /usr/share/nginx/html/site/current;
        expires max;
        try_files $uri =404;
    }
    # modelos 3D, texturas e o decodificador Draco têm nomes fixos: um dia de cache
    location ~ ^/(models|textures|draco)/ {
        root /usr/share/nginx/html/site/current;
        expires 1d;
        try_files $uri =404;
    }
    # página única (o estado fica em ?mode/?lang/?focus)
    location / {
        root /usr/share/nginx/html/site/current;
        try_files $uri $uri/ /index.html;
    }
    # <<< dellanio:site-3d
