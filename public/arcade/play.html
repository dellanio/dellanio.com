<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Fliperama</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<!--
  One game per page, loaded in an iframe by the boteco's arcade menu, so the
  emulator's globals and audio go away with the iframe.
  ?system=snes|psx  &rom=/arcade/roms/...  (only homebrew the authors allow us
  to host: see /arcade/games.json for each one's licence)
  EmulatorJS (GPL-3.0) from its CDN, pinned. PS1 runs on pcsx_rearmed's own
  HLE BIOS: no Sony BIOS is served.
-->
<div id="game"></div>
<script>
  const q = new URLSearchParams(location.search)
  const system = q.get('system') === 'psx' ? 'psx' : 'snes'
  const rom = q.get('rom') || ''
  // only files from our own ROM folder
  if (!/^\/arcade\/roms\/[\w./-]+$/.test(rom) || rom.includes('..')) {
    document.body.innerHTML = '<p style="color:#fff;font:16px sans-serif;padding:24px">Jogo não encontrado.</p>'
  } else {
    window.EJS_player = '#game'
    window.EJS_core = system
    window.EJS_gameUrl = rom
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/'
    // the emulator's own play button: the click inside this frame is what lets the game start with sound
    window.EJS_startOnLoaded = false
    window.EJS_color = '#e8a91c'
    window.EJS_volume = 0.6
    window.EJS_language = 'pt-BR'
    window.EJS_Buttons = { netplay: false }
    const s = document.createElement('script')
    s.src = window.EJS_pathtodata + 'loader.js'
    document.body.appendChild(s)
  }
</script>
</body>
</html>
